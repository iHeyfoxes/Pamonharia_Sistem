<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Painel da Pamonharia</title><link rel="stylesheet" href="admin.css"></head><body><header class="topo"><div class="container"><div class="marca">🌽 Pamonharia <span>Painel</span></div><div class="topo-acoes"><span id="usuario-logado"></span><button class="botao sair" onclick="sair()">Sair</button><a href="index.html">← Cardápio</a><button class="botao configuracoes-btn" onclick="abrirConfiguracoes()">⚙️ Configurações</button></div></div></header><main class="container"><section class="cabecalho"><div><p class="etiqueta">ADMINISTRAÇÃO</p><h1>Pedidos</h1><p>Pedidos reais recebidos pelo sistema.</p></div></section><section class="resumos"><div class="resumo"><span>📦 Total</span><strong id="total-pedidos">0</strong></div><div class="resumo"><span>⏳ Pendentes</span><strong id="pendentes">0</strong></div><div class="resumo"><span>💰 Faturamento</span><strong id="faturamento">R$ 0,00</strong></div></section><section class="filtros"><button class="filtro ativo" onclick="filtrarPedidos('todos',this)">Todos</button><button class="filtro" onclick="filtrarPedidos('pending',this)">Pendentes</button><button class="filtro" onclick="filtrarPedidos('preparing',this)">Preparando</button><button class="filtro" onclick="filtrarPedidos('ready',this)">Prontos</button><button class="filtro" onclick="filtrarPedidos('finalized',this)">Finalizados</button></section><section id="pedidos" class="pedidos"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script><div id="configuracoes" class="modal-admin escondido"><div class="config-caixa"><button class="fechar-config" onclick="fecharConfiguracoes()">×</button><p class="etiqueta">CONFIGURAÇÕES</p><h2>Dados da pamonharia</h2><p class="config-ajuda">Altere aqui os dados usados pelo sistema.</p><label>Nome da pamonharia<input id="cfg-nome" type="text"></label><label>WhatsApp para receber pedidos<input id="cfg-whatsapp" type="tel" placeholder="(62) 99999-9999"></label><label>Endereço<input id="cfg-endereco" type="text"></label><label>Horário de funcionamento<input id="cfg-horario" type="text"></label><div class="config-grid"><label>Taxa de entrega<input id="cfg-taxa" type="number" min="0" step="0.01"></label><label>Pedido mínimo<input id="cfg-minimo" type="number" min="0" step="0.01"></label></div><button class="botao salvar-config" onclick="salvarConfiguracoes()">Salvar configurações</button><p id="config-msg" class="config-msg"></p></div></div></body></html>
